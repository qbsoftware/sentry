upstream sentry-web {
    server 127.0.0.1:9000;
    keepalive 2;
}

upstream sentry-relay {
    server 127.0.0.1:3000;
    keepalive 2;
}

server {
    listen 0:80;
    listen [::]:80;
    listen 0:443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/sentry.qb.software/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentry.qb.software/privkey.pem;

    server_name sentry.qb.software;

    location /.well-known {
        root /srv/letsencrypt/htdocs;
    }

    location /api/store/ {
        proxy_pass http://sentry-relay;
    }

    location ~ ^/api/[1-9]\d*/ {
        proxy_pass http://sentry-relay;
    }

    location ^~ /api/0/relays/ {
        proxy_pass http://sentry-relay;
    }

    location / {
        proxy_pass http://sentry-web;
    }

    location /_static/ {
        proxy_pass http://sentry-web;
        proxy_hide_header Content-Disposition;
    }

    # redirections

    if ($scheme = http) {
        rewrite ^/(.*)$ https://sentry.qb.software/$1 permanent;
    }

    access_log /var/log/nginx/sentry.access.log;
    error_log  /var/log/nginx/sentry.error.log;
}

